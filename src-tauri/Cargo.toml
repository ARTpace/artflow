[package]
name = "artflow-tauri-preview"
version = "0.1.8"
description = "Isolated Tauri desktop preview for Artflow"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
url = "2"
webbrowser = "1"
flate2 = "1"
base64 = "0.22"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
# 托管项目存储的元数据库：旧实现在 storage/projectRepository.cjs 用 node:sqlite，
# 且依赖 rtree 虚拟表做视口查询，必须捆绑自带 sqlite 才能等价移植。
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
# MCP 宿主是可被外部客户端连入的本地 HTTP 服务；ComfyUI 代理要出站请求本机回环。
tiny_http = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
